<!doctype html>
<html lang="en">
<head>

    <title>Imie Nazwisko (00000) - IS LAB C</title>

    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>

<body>
<main class="kontener">
    <h1>Moja pogoda</h1>
    <p>Sprawdź aktualną pogodę i prognozę na najbliższe 5 dni.</p>

    <form id="formularzPogody" class="wyszukiwarka">
        <input type="text" id="miasto" placeholder="Wpisz miasto, np. Szczecin" value="Szczecin">
        <button id="przycisk" type="submit">Pogoda</button>
    </form>

    <section id="aktualnaPogoda"></section>
    <section id="prognoza"></section>
</main>
